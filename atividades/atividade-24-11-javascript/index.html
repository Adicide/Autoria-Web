<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATIVIDADE JAVASCRIPT - 24 DE NOVEMBRO</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            display: flex;
            min-height: 100vh;
            justify-content: center;
            align-items: center;
        }

        fieldset {
            display: flex;
            flex-direction: column;
            max-width: 20rem;
            padding: 1.5rem;
        }

        label {
            margin: 1rem;
        }
        
        button {
            width: 3.5rem;
        }
    </style>
</head>
<body>
    <fieldset>
        <label for="senha_usuario">
            Insira sua senha: <input id="senha_usuario" type="password"> 
        </label>

        <label for="senha_teste">
            Confirme sua senha: <input id="senha_teste" type="password">
        </label>
            
        <button id="botao_enviar">Enviar</button>
        <span id="aviso"></span>
    </fieldset>
    
    <script>
        let senhaUsuario = document.getElementById("senha_usuario");
        let senhaTeste = document.getElementById("senha_teste");
        let botaoEnviar = document.getElementById("botao_enviar"); 
        
        botaoEnviar.addEventListener("click", function(e) {
            if (senhaUsuario.value == senhaTeste.value) {
                console.log("As duas senhas são iguais!")
                aviso.innerHTML = "As senhas coincidem."
            } else {
                console.log("ATENÇÃO: as senhas não são iguais.")
                let aviso = document.getElementById("aviso")
                aviso.innerHTML = "As senhas não coincidem."
            }
        })
        
    </script>
</body>
</html>
