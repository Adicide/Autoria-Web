<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body > ol {
            /* seleciona o ol imediatamente
            dentro do body */
            display: flex;
        }

        li {
            list-style-type: none;
            margin-right: 2rem;
            position: relative;
            cursor: pointer; 
            /* coloca o cursor de mãozinha */
        }

        ol ol {
            background-color: aquamarine;
            padding: 2rem;
            visibility: hidden;
        }

        li:hover ol { /* torna o ol visível ao passar o mouse no li */
            visibility: visible;
        }
    </style>
</head>
<body> <!-- é uma simulação de menu, colocar os âncoras depois... -->
    <ol>
        <li>Página inicial</li>
        <li>Programação
            <ol>
                <li>Palestras</li>
                <li>Minicursos</li>
            </ol>
        </li> <!-- O LI FECHA DEPOIS DA LISTA INTERNA -->
        <li>Organização</li>
        <li>Exposição
            <ol>
                <li>Tecnologia</li>
                <li>Empreendedorismo</li>
                <li>Projetos</li>
            </ol>
        </li>
        <li>Contato</li>
    </ol>
</body>
</html>
