    <link rel="stylesheet" href="principal.css">
</head>
<body>
    <h1>EMPREENDA CNAT
        <img src="ITNC Logo.jpg" alt="marca da ITNC"> <!-- alt = Texto alternativo para acesssibilidade -->
    </h1>
    <!-- 
        IMG:
            - Permite incluir imagem no HTML
            - Imagem no HTML são conteudistas 
            (são diferentes de uma imagem decorativa)
            - Imagem pode ser: png, jpg, jpeg, gif, jiff...
            src = source = código = Recebe o nome do arquivo
            alt = alternative = conteúdo alternativo - acessibilidade
            - A marcação da imagem pode ficar dentro da marcação h1, p, li, figure...

        FIGURE:
            - É UMA MARCAÇÃO NOVA que representa um bloco para imagem
            - Pode ter uma imagem ou várias
            - Pode ter figcaption - que é uma marcação de legenda -->
    
    <figure>
        <img src="EMPREENDA CNAT.png" alt="banner do evento">
        <figcaption>Legenda do bloco de imagens</figcaption>
    </figure>
