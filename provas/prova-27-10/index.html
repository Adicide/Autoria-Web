<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Você ganhou um curso gratuito de Desenvolvimento Web!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@100..900&display=swap" rel="stylesheet">
    <style>
        * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        }

        body {
            font-family: "Commissioner", Helvetica, sans-serif;
            max-width: 100vw;
            max-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-top: 1rem;
        }

        h1 {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        button {
            background-color: orange;
            padding: 0.5rem;
            border-radius: 0.5rem;
        }

        form {
            display: flex;
            justify-content: center; 
            align-items: center;
            margin-top: 19rem; /* 19rem daqui + 1rem do h1 = 20rem pra centralizar o form */
        }

        fieldset {
            justify-content: center; 
            align-items: center;
            padding: 1rem;
            border-radius: 1rem;
            box-shadow: 10px 10px;
        }

        @media screen and (max-width: 850px) {
            body {
                background-color: rgb(7, 165, 238);
            }
        }
    </style>
</head>
<body>
    <header>    
        <h1>PARABÉNS!!! Você ganhou um curso gratuito de Desenvolvimento Web!!!</h1>

        <button>Ajuda</button>
    </header>
    
    
    <main>
        <form action="">
            <fieldset>
                <h4>Escolha apenas 1 das opções abaixo.</h4> <br>

                <label for="curso_html">
                    <input type="radio" name="curso" id="curso_html"> HTML <br>
                </label>

                <label for="curso_css">
                    <input type="radio" name="curso" id="curso_css"> CSS <br>
                </label>
                
                <label for="curso_js">
                    <input type="radio" name="curso" id="curso_js"> JavaScript <br><br>
                </label>

                <label for="botao_enviar">
                    <input type="submit" id="botao_enviar">
                </label>
            </fieldset>
        </form>
    </main>

</body>
</html>
