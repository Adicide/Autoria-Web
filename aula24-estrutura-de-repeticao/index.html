<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        for (let i = 0; i < 10; i++) {
            // incremento -> i++ / i += 1 / i = i + 1
            // pode ser ++i (incrementa antes) ou i++ (incrementa depois) 
            console.log("FOR com incremento: " + i);
            console.log(`FOR com incremento: ${i}`);
        }
        
        for (let i = 10; i > 0; i--) {
            console.log("FOR com decremento " + i);
        }

        const frutas = ['banana', 'morango', 'goiaba']
        frutas.forEach(f => {
            console.log(f)
        });
    </script>
</body>
</html>
