<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        for (let i = 0; i < 10; i++) {
            // incremento -> i++ / i += 1 / i = i + 1
            // pode ser ++i (incrementa antes) ou i++ (incrementa depois) 
            console.log("FOR com incremento: " + i);
            console.log(`FOR com incremento: ${i}`);
        }
        
        for (let i = 10; i > 0; i--) {
            console.log("FOR com decremento: " + i);
        }

        const frutas = ['banana', 'morango', 'goiaba'];
        frutas.forEach(f => { // variável "f" representa um item da lista
            console.log("FOREACH: " + f);
        })

        for (let i = 0; i < frutas.length; i++) {
            console.log("FOR: " + frutas[i]);
        }

        let j = 0;
        while (j < 10) {
            console.log("WHILE: " + j);
            j += 2;
        }
    </script>
    <div style="font-size: 2rem;" id="resultado"></div>
    <script>
        let resultado = document.getElementById("resultado");
        for (let i = 1; i < 7; i++) {
            resultado.innerHTML += `<p style="font-size: ${i}rem">INFOWEB</p> `;
            // '+=' é para pegar o valor anterior e adicionar o novo
        }
    </script>
</body>
</html>
